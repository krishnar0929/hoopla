name: hoopla
description: Hoopla - plan your event, find nearby helpers, and play games people remember.
publish_to: 'none'
version: 0.1.0+10

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.4.4
  cloud_functions: '>=5.5.0 <6.0.0'
  device_info_plus: '>=11.0.0 <14.0.0'
  firebase_auth: ^5.3.1
  firebase_core: ^3.6.0
  firebase_storage: ^12.3.4
  flutter_local_notifications: ^19.4.2
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  in_app_review: ^2.0.10
  package_info_plus: '>=8.0.0 <11.0.0'
  shared_preferences: ^2.3.2
  timezone: ^0.10.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
